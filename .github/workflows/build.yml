name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-windows-app:
    name: Test PC app (simulated phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        working-directory: windows
        run: pip install -r requirements.txt
      - name: End-to-end tests
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_headless.py

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk ClipBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-android
          path: ClipBridge.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name ClipBridge --icon assets/clipbridge.ico ClipBridge.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-windows
          path: windows/dist/ClipBridge.exe

  release:
    name: Publish to Releases
    needs: [test-windows-app, android, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cat > notes.md <<NOTES
          **ClipBridge $VERSION** — built from \`${GITHUB_SHA::7}\`.

          | Device | Download |
          |---|---|
          | Android phone | **ClipBridge.apk** (below) — open it on the phone to install or update |
          | Windows PC | **ClipBridge.exe** (below) — run it; updates replace the old file |

          Setup guide: [docs/SETUP.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/SETUP.md) · What's new: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)
          NOTES
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/ClipBridge.apk out/ClipBridge.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ClipBridge $VERSION" --notes-file notes.md
