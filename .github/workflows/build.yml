name: Build

# Manual only: start it from the Actions tab → Build → Run workflow.
# (Automatic runs on push are off while GitHub Actions is unavailable on this account.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-windows-app:
    name: Test PC app (simulated phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        working-directory: windows
        run: pip install -r requirements.txt
      - name: End-to-end tests
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_headless.py

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unpack signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CLIPBRIDGE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          CLIPBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ClipBridge.apk
          else
            echo "::warning::No signing key secrets set — the APK was built unsigned and won't be published."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('ClipBridge.apk') != '' }}
        with:
          name: ClipBridge-android
          path: ClipBridge.apk

  windows:
    name: Build Windows package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ClipBridge-Windows.zip
        run: |
          pip install ziglang
          python windows/build_portable.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-windows
          path: dist/ClipBridge-Windows.zip

  release:
    name: Publish to Releases
    needs: [test-windows-app, android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cat > notes.md <<NOTES
          **ClipBridge $VERSION** — built automatically from \`${GITHUB_SHA::7}\`.

          | Device | Download |
          |---|---|
          | Android phone | **ClipBridge.apk** — open it on the phone to install or update |
          | Windows PC | **ClipBridge-Windows.zip** — extract it and run ClipBridge.exe (nothing to install) |

          Setup guide: [docs/SETUP.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/SETUP.md) · What's new: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)
          NOTES
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ClipBridge $VERSION" --notes-file notes.md
